name: Build Mod Library

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Install Android NDK
      run: |
        echo "Installing NDK..."
        sudo apt-get update
        sudo apt-get install -y android-sdk-ndk-common

    - name: Compile with NDK
      run: |
        cd app/src/main/jni
        ndk-build
      env:
        ANDROID_NDK_HOME: /usr/lib/android-sdk/ndk-bundle

    - name: Upload Artifact
      uses: actions/upload-artifact@v3
      with:
        name: compiled-so-library
        path: app/src/main/libs/
        
